<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Niten M | Full Stack Engineer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

<style>

body{
margin:0;
background:black;
font-family:Inter;
color:white;
overflow-x:hidden;
}

/* 3D Canvas */

#bg{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* NAV */

nav{
position:fixed;
width:100%;
padding:20px 40px;
display:flex;
justify-content:space-between;
background:rgba(0,0,0,.5);
backdrop-filter:blur(10px);
z-index:1000;
}

nav a{
color:#aaa;
text-decoration:none;
margin-left:20px;
}

nav a:hover{
color:white;
}

/* HERO */

.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}

.hero h1{
font-size:60px;
background:linear-gradient(90deg,#6366f1,#ec4899);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
color:#aaa;
margin-top:10px;
}

/* TERMINAL */

.terminal{
width:700px;
max-width:90%;
background:#111;
border-radius:10px;
padding:20px;
margin-top:40px;
font-family:monospace;
}

.terminal-line{
margin:5px 0;
color:#0f0;
}

/* PROJECTS */

.section{
padding:100px 40px;
max-width:1200px;
margin:auto;
}

.projects{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

.project{
background:#111;
padding:20px;
border-radius:10px;
transition:.3s;
}

.project:hover{
transform:translateY(-10px);
}

/* CONTACT */

.contact{
text-align:center;
}

</style>

</head>

<body>

<canvas id="bg"></canvas>

<nav>

<div>Niten M</div>

<div>

<a href="#projects">Projects</a>
<a href="#contact">Contact</a>

</div>

</nav>


<section class="hero">

<h1 id="title">Full Stack Engineer</h1>

<div class="subtitle">
Angular • React • Node • Kafka • GraphQL • Microfrontends
</div>

<div class="terminal" id="terminal">

<div class="terminal-line">Initializing system...</div>

</div>

</section>


<section class="section">

<h2>GitHub Projects</h2>

<div id="projects" class="projects">

Loading projects...

</div>

</section>


<section id="contact" class="section contact">

<h2>Contact</h2>

<p>Email: your@email.com</p>

</section>


<script>

/* ========================
   THREE JS BACKGROUND
======================== */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({
canvas:document.querySelector('#bg')
});

renderer.setSize(window.innerWidth,window.innerHeight);

camera.position.z = 5;

const geometry = new THREE.TorusGeometry(10,3,16,100);

const material = new THREE.MeshStandardMaterial({
color:0x6366f1,
wireframe:true
});

const torus = new THREE.Mesh(geometry,material);

scene.add(torus);

const light = new THREE.PointLight(0xffffff);

light.position.set(5,5,5);

scene.add(light);

function animate(){

requestAnimationFrame(animate);

torus.rotation.x += 0.002;
torus.rotation.y += 0.002;

renderer.render(scene,camera);

}

animate();


/* ========================
   GSAP ANIMATIONS
======================== */

gsap.from("#title",{

opacity:0,
y:100,
duration:1.5

});


gsap.from(".subtitle",{

opacity:0,
y:50,
delay:.5,
duration:1

});


gsap.from(".terminal",{

opacity:0,
scale:.8,
delay:1,
duration:1

});


/* ========================
   TERMINAL INTRO
======================== */

const terminal = document.getElementById("terminal");

const lines = [

"> Booting NitenOS...",
"> Loading Microfrontend Engine...",
"> Connecting to GitHub...",
"> Initializing GraphQL Gateway...",
"> Ready."

];

let i = 0;

function typeLine(){

if(i < lines.length){

const div = document.createElement("div");

div.className = "terminal-line";

terminal.appendChild(div);

let j = 0;

const text = lines[i];

function typeChar(){

if(j < text.length){

div.innerHTML += text[j];

j++;

setTimeout(typeChar,30);

}

}

typeChar();

i++;

setTimeout(typeLine,500);

}

}

typeLine();


/* ========================
   GITHUB PROJECT AUTOLOAD
======================== */

const username = "your-github-username";

fetch(`https://api.github.com/users/${username}/repos`)

.then(res => res.json())

.then(repos => {

const container = document.getElementById("projects");

container.innerHTML = "";

repos.slice(0,6).forEach(repo => {

const div = document.createElement("div");

div.className = "project";

div.innerHTML = `

<h3>${repo.name}</h3>

<p>${repo.description || ""}</p>

<a href="${repo.html_url}" target="_blank">
View Code →
</a>

`;

container.appendChild(div);

});

});


/* ========================
   MICROFRONTEND PLUGIN SYSTEM
======================== */

class PluginSystem{

constructor(){

this.plugins = [];

}

register(plugin){

this.plugins.push(plugin);

plugin.init();

}

}

const system = new PluginSystem();

/* Example Plugin */

system.register({

init(){

console.log("Plugin initialized");

}

});


</script>

</body>

</html>
